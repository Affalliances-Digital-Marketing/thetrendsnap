name: Build and deploy

# Push to main -> build -> deploy to the VPS.
# Pull requests only build, so a broken change is caught before it is merged.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

# One deployment at a time. A queued run waits instead of cancelling a live one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  # Public, build-time values for the site. Override them under
  # Settings -> Secrets and variables -> Actions -> Variables if they ever change.
  VITE_API_URL: ${{ vars.VITE_API_URL || 'https://admin.thetrendsnap.com/api' }}
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL || 'https://thetrendsnap.com' }}
  VITE_AD_PLACEHOLDER: "false"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            thetrendsnap.com/package-lock.json
            admin.thetrendsnap.com/package-lock.json

      - name: Install frontend dependencies
        working-directory: thetrendsnap.com
        run: npm ci --no-audit --no-fund

      - name: Typecheck frontend
        working-directory: thetrendsnap.com
        run: npm run typecheck

      - name: Build frontend
        working-directory: thetrendsnap.com
        run: npm run build

      - name: Install backend dependencies
        working-directory: admin.thetrendsnap.com
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Check backend loads
        working-directory: admin.thetrendsnap.com
        # Catches syntax errors and missing modules. Nothing listens and no
        # database is touched: only app.js is required, not server.js.
        run: node -e "require('./app.js'); console.log('backend loads')"

      - name: Keep the frontend build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: thetrendsnap.com/dist
          retention-days: 3

  deploy:
    name: Deploy to VPS
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
      REMOTE_STAGE: /var/www/.deploy/thetrendsnap/incoming
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: stage/web-dist

      - name: Prepare upload
        run: |
          # Source only: dependencies are installed on the server and env files
          # never leave it.
          rsync -a --exclude node_modules --exclude dist --exclude '.env*' --exclude '*.tsbuildinfo' \
            thetrendsnap.com/ stage/web-src/
          rsync -a --exclude node_modules --exclude '.env*' \
            admin.thetrendsnap.com/ stage/api/
          cp deploy/remote-deploy.sh stage/remote-deploy.sh
          test -f stage/web-dist/index.html

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SERVER_USER" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Add SERVER_HOST, SERVER_USER and SSH_PRIVATE_KEY under Settings -> Secrets and variables -> Actions"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$SERVER_PORT" -H "$SERVER_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          echo "SSH_CMD=ssh -i $HOME/.ssh/deploy_key -p $SERVER_PORT -o BatchMode=yes -o ConnectTimeout=20" >> "$GITHUB_ENV"

      - name: Upload to server
        run: |
          $SSH_CMD "$SERVER_USER@$SERVER_HOST" "mkdir -p $REMOTE_STAGE"
          rsync -az --delete -e "$SSH_CMD" stage/ "$SERVER_USER@$SERVER_HOST:$REMOTE_STAGE/"

      - name: Deploy
        run: |
          $SSH_CMD "$SERVER_USER@$SERVER_HOST" \
            "bash $REMOTE_STAGE/remote-deploy.sh ${{ github.sha }}"

      - name: Check live URLs
        run: |
          check() {
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$1" || true)
              echo "$1 attempt $attempt: HTTP $code"
              [ "$code" = "200" ] && return 0
              sleep 5
            done
            echo "::error::$1 did not return 200"
            return 1
          }
          check https://thetrendsnap.com/
          check https://admin.thetrendsnap.com/api/health

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
